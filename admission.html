<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admission Form | StepUp Classes</title>

<link rel="stylesheet" href="style.css">

<style>
body{
background:#f4f8ff;
font-family:Arial,sans-serif;
}

.form-box{
max-width:700px;
margin:100px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#0d47a1;
margin-bottom:25px;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#0d47a1;
color:white;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#08306b;
}
</style>

</head>

<body>

<div class="form-box">

<h1>StepUp Classes Admission Form</h1>

<form>

<input type="text" placeholder="Student Name" required>

<input type="text" placeholder="Father's Name" required>

<input type="date" required>

<select required>
<option>Select Class</option>
<option>Class 6</option>
<option>Class 7</option>
<option>Class 8</option>
<option>Class 9</option>
<option>Class 10</option>
<option>Class 11</option>
<option>Class 12</option>
</select>

<input type="tel" placeholder="Mobile Number" required>

<textarea rows="4" placeholder="Address"></textarea>

<button type="submit">
Submit Admission
</button>

</form>

</div>

</body>
</html>

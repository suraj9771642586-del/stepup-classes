<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Result | StepUp Classes</title>

<link rel="stylesheet" href="style.css">

<style>
body{
font-family:Arial,sans-serif;
background:#f4f8ff;
margin:0;
}

header{
background:#0d47a1;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:500px;
margin:50px auto;
background:#fff;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:12px;
background:#0d47a1;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#08306b;
}

#result{
margin-top:20px;
font-size:18px;
font-weight:bold;
text-align:center;
}

.btn{
display:inline-block;
margin-top:20px;
padding:10px 20px;
background:#0d47a1;
color:#fff;
text-decoration:none;
border-radius:6px;
}
</style>

</head>
<body>

<header>
<h1>Student Result</h1>
</header>

<div class="container">

<input type="text" id="roll" placeholder="Enter Roll Number">

<button onclick="checkResult()">Check Result</button>

<div id="result"></div>

<div style="text-align:center;">
<a href="index.html" class="btn">⬅ Back to Home</a>
</div>

</div>

<script>
function checkResult(){

const roll=document.getElementById("roll").value;
const result=document.getElementById("result");

if(roll=="1001"){
result.innerHTML="✅ Suraj Kumar<br>Percentage: 92%";
}
else if(roll=="1002"){
result.innerHTML="✅ Rahul Kumar<br>Percentage: 88%";
}
else{
result.innerHTML="❌ Result Not Found";
}

}
</script>

</body>
</html>

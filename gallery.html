<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | StepUp Classes</title>

<link rel="stylesheet" href="style.css">

<style>

.gallery-container{
max-width:1200px;
margin:100px auto;
padding:20px;
}

.gallery-container h1{
text-align:center;
color:#0d47a1;
margin-bottom:30px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.gallery img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
transition:.3s;
}

.gallery img:hover{
transform:scale(1.05);
}

.back{
display:block;
width:180px;
margin:40px auto;
padding:12px;
text-align:center;
background:#0d47a1;
color:white;
text-decoration:none;
border-radius:30px;
font-weight:bold;
}

.back:hover{
background:#08306b;
}

</style>

</head>

<body>

<div class="gallery-container">

<h1>StepUp Classes Gallery</h1>

<div class="gallery">

<img src="https://picsum.photos/400/300?1">
<img src="https://picsum.photos/400/300?2">
<img src="https://picsum.photos/400/300?3">
<img src="https://picsum.photos/400/300?4">
<img src="https://picsum.photos/400/300?5">
<img src="https://picsum.photos/400/300?6">

</div>

<a href="index.html" class="back">
⬅ Back to Home
</a>

</div>

</body>
</html>

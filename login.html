<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | StepUp Classes</title>

<link rel="stylesheet" href="style.css">

<style>
body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0d47a1,#42a5f5);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:#fff;
padding:40px;
width:350px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
text-align:center;
}

.login-box h2{
color:#0d47a1;
margin-bottom:25px;
}

.login-box input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

.login-box button{
width:100%;
padding:12px;
background:#0d47a1;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

.login-box button:hover{
background:#08306b;
}

.back{
display:inline-block;
margin-top:20px;
text-decoration:none;
color:#0d47a1;
font-weight:bold;
}
</style>

</head>

<body>

<div class="login-box">

<h2>Student Login</h2>

<form>

<input type="text" placeholder="Student ID" required>

<input type="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<a href="index.html" class="back">⬅ Back to Home</a>

</div>

</body>
</html>
